name: 유튜브 임베드 해석

# 검색어 → 영상 ID 해석은 YouTube Data API 키가 필요하다.
# 키는 저장소 시크릿(YOUTUBE_API_KEY)에만 두고, 이 워크플로가 대신 실행한다.
# Actions 탭에서 "Run workflow" 로 수동 실행한다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '반영하지 않고 결과만 확인'
        type: boolean
        default: false
      mode:
        description: '검색 방식'
        type: choice
        default: rejudge
        options:
          - rejudge   # 캐시로 다시 판정 (API 할당량 안 씀)
          - resolve   # 새로 검색 (58건 = 5,800 units)

permissions:
  contents: write

concurrency:
  group: resolve-media
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # 캐시 커밋을 푸시해야 하므로 토큰을 남긴다
          persist-credentials: true

      - name: 시크릿 확인
        env:
          KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::저장소 시크릿 YOUTUBE_API_KEY 가 없습니다."
            echo "Settings → Secrets and variables → Actions → New repository secret" >> "$GITHUB_STEP_SUMMARY"
            echo "이름은 정확히 YOUTUBE_API_KEY 로 만드세요." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "시크릿 확인됨 (길이 ${#KEY})"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 검색어를 영상 ID 로 해석
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DRY: ${{ inputs.dry_run }}
          MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail
          # 실패해도 캐시는 남겨야 하므로 종료코드를 따로 받는다
          if [ "$DRY" = "true" ]; then
            npm run --silent verify:media -- --$MODE 2>&1 | tee result.log || echo "EXIT=$?" >> result.log
          else
            npm run --silent verify:media -- --$MODE --write 2>&1 | tee result.log || echo "EXIT=$?" >> result.log
          fi
          grep -q "^EXIT=" result.log && echo "::warning::해석 단계가 비정상 종료했습니다 — 요약을 확인하세요"
          exit 0

      - name: 검색 캐시 보존
        if: ${{ inputs.mode == 'resolve' }}
        run: |
          if [ ! -f scripts/media-candidates.json ]; then
            echo "캐시 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git diff --quiet scripts/media-candidates.json 2>/dev/null; then
            echo "캐시에 변경이 없습니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          COUNT=$(python3 -c "import json;print(len(json.load(open('scripts/media-candidates.json'))['results']))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/media-candidates.json
          git commit \
            -m "chore(media): 유튜브 검색 결과 캐시 ${COUNT}건" \
            -m "search.list 는 1회 100 units, 일일 무료 할당량은 10,000 units 다. 이 캐시가 있으면 가드를 고칠 때마다 --rejudge 로 공짜로 다시 판정할 수 있다. 공개 메타데이터만 담으며 API 키는 포함하지 않는다."
          git push origin main
          echo "**검색 캐시 ${COUNT}건을 저장했습니다.** 이후 판정은 rejudge 모드로 할당량 없이 돌립니다." >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "### 유튜브 임베드 해석 결과"
            echo '```'
            sed -E 's/(key=)[A-Za-z0-9_-]+/\1***/g' result.log | tail -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 품질 게이트
        if: ${{ inputs.dry_run == false }}
        run: |
          npm run typecheck
          npm test

      - name: 변경분 반영
        if: ${{ inputs.dry_run == false }}
        run: |
          if git diff --quiet src/data/videos.ts; then
            echo "승격된 영상이 없습니다 — 커밋하지 않습니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PROMOTED=$(grep -c "verified: true" src/data/videos.ts || true)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.ts
          git commit \
            -m "chore(media): 유튜브 임베드 ${PROMOTED}편 승격" \
            -m "검색어로 후보를 찾아 oEmbed 로 생존을 확인한 결과를 반영한다. 선언된 채널과 검색 결과 채널이 일치한 항목만 채택했고, 불일치·사망 항목은 검색 폴백으로 남는다." \
            -m "워크플로: resolve-media.yml"
          git push origin main
          echo "**임베드 ${PROMOTED}편 승격, main 에 반영했습니다.** 배포가 자동으로 돕니다." >> "$GITHUB_STEP_SUMMARY"
