name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/jazz-piano-improvisation-service-la2kut
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 배포 전 품질 게이트 — 깨진 것을 배포하지 않는다
      - name: 타입 검사
        run: npm run typecheck
      - name: 단위 테스트 + 콘텐츠 정합성
        run: npm run test

      # ⚠ 최초 1회, 저장소 소유자가 직접 켜야 한다:
      #   Settings → Pages → Build and deployment → Source: "GitHub Actions"
      # 워크플로의 GITHUB_TOKEN 으로는 Pages 를 켤 수 없다
      # (enablement: true 를 쓰면 "Resource not accessible by integration" 으로 실패한다).
      # 켜고 나면 이 워크플로가 그대로 동작한다.
      - name: Pages 설정
        id: pages
        uses: actions/configure-pages@v5

      # 프로젝트 페이지는 /<repo>/ 하위에 서빙되므로 base 를 맞춰야 한다
      - name: 빌드
        run: npm run build
        env:
          JAZZYTORY_BASE: ${{ steps.pages.outputs.base_path }}

      - name: 번들 크기 기록
        run: |
          echo "### 번들 크기 (gzip)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for f in dist/assets/*.js dist/assets/*.css; do
            [ -f "$f" ] || continue
            printf "%8s  %s\n" "$(gzip -c "$f" | wc -c | awk '{printf "%.0f KB", $1/1024}')" "$(basename "$f")" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
